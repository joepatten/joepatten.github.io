<head>
  <meta charset="UTF-8">
  <title>Joe's Terminal</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    /* Scoped container so nothing leaks globally */
    #joe-terminal-container {
      display: flex;
      justify-content: center;
      padding: 40px;
      /* Remove or customize if you don't want spacing */
    }

    /* The terminal box itself */
    #joe-terminal {
      width: 800px;
      max-width: 100%;
      height: 400px;
      background: #02030a;
      border-radius: 6px;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
      padding: 16px;
      overflow-y: auto;
      border: 1px solid #1f2833;
      font-family: "Fira Code", "Courier New", monospace;
      color: #c5c6c7;
    }

    /* Lines + prompt (scoped) */
    #joe-terminal .jt-line,
    #joe-terminal .jt-prompt-line {
      white-space: pre-wrap;
      line-height: 1.4;
      font-size: 14px;
    }

    #joe-terminal .jt-prompt-label {
      color: #66fcf1;
    }

    #joe-terminal .jt-prompt-input {
      color: #f8f8f2;
    }

    #joe-terminal .jt-cursor {
      display: inline-block;
      width: 8px;
      margin-left: 2px;
    }

    #joe-terminal .jt-cursor.jt-hidden {
      opacity: 0;
    }

    #joe-terminal .jt-output-info {
      color: #c5c6c7;
    }

    #joe-terminal .jt-output-error {
      color: #ff5555;
    }

    #joe-terminal .jt-output-success {
      color: #50fa7b;
    }

    /* Links inside the terminal only */
    #joe-terminal a {
      color: #66fcf1;
      text-decoration: none;
    }

    #joe-terminal a:hover {
      text-decoration: underline;
    }

    /* Focus outline only for terminal */
    #joe-terminal:focus {
      outline: none;
    }
  </style>
</head>
<body>
  <!-- You can embed this container anywhere in your page -->
  <div id="joe-terminal-container">
    <div id="joe-terminal" tabindex="0"></div>
  </div>

  <script>
    // --- State ---
    const term = d3.select("#joe-terminal");
    let lines = [];      // { text, className, isHtml }
    let currentInput = "";
    let cursorVisible = true;

    const PROMPT = "joe@terminal:~$";

    // --- Helper: escape HTML ---
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[m];
      });
    }

    // --- Rendering ---
    function render() {
      const lineSel = term.selectAll(".jt-line")
        .data(lines, (d, i) => i);

      const lineEnter = lineSel.enter()
        .append("div")
        .attr("class", d => "jt-line " + (d.className || ""));

      lineEnter
        .style("opacity", 0)
        .transition()
        .duration(120)
        .style("opacity", 1);

      const allLines = lineEnter.merge(lineSel);
      allLines
        .attr("class", d => "jt-line " + (d.className || ""))
        .html(d => d.isHtml ? d.text : escapeHtml(d.text));

      lineSel.exit().remove();

      // Ensure prompt is always at the bottom
      term.selectAll(".jt-prompt-line").remove();

      term.append("div")
        .attr("class", "jt-prompt-line")
        .html(
          `<span class="jt-prompt-label">${escapeHtml(PROMPT)}</span> ` +
          `<span class="jt-prompt-input">${escapeHtml(currentInput)}</span>` +
          `<span class="jt-cursor ${cursorVisible ? "" : "jt-hidden"}">█</span>`
        );

      const node = term.node();
      node.scrollTop = node.scrollHeight;
    }

    // --- Cursor blink ---
    setInterval(() => {
      cursorVisible = !cursorVisible;
      render();
    }, 500);

    // --- Helper to append a line ---
    function print(text, className = "jt-output-info", isHtml = false) {
      lines.push({ text, className, isHtml });
    }

    // --- Fake filesystem for easter eggs ---
    const fakeFsRoot = [
      "README.md",
      "skills.txt",
      "projects/",
      "job-board/",
      "top_secret/",
      ".easter_egg"
    ];

    // --- Command handling ---
    function runCommand(raw) {
      const input = raw.trim();
      if (!input) return;

      // Echo the command itself into history
      lines.push({
        text: `${PROMPT} ${input}`,
        className: "jt-output-info",
        isHtml: false
      });

      const parts = input.split(/\s+/);
      const cmd = parts[0];
      const args = parts.slice(1);

      // Hidden / special first
      if (cmd === "ls") {
        handleLs(args);
      } else if (cmd === "cd") {
        handleCd(args);
      } else if (cmd === "sudo") {
        handleSudo(args);
      } else if (cmd === "rm" && args[0] === "-rf" && args[1] === "/") {
        handleRmRf();
      } else if (cmd === "cat") {
        handleCat(args);
      } else {
        // Public commands
        switch (cmd) {
          case "help":
            handleHelp();
            break;
          case "clear":
            lines = [];
            break;
          case "about":
            handleAbout();
            break;
          case "whoami":
            handleWhoAmI();
            break;
          case "skills":
            handleSkills();
            break;
          case "interests":
            handleInterests();
            break;
          case "projects":
            handleProjects();
            break;
          case "jobboard":
            handleJobBoard();
            break;
          case "contact":
            handleContact();
            break;
          default:
            print(`bash: ${cmd}: command not found`, "jt-output-error");
            print("Type 'help' to see available commands.");
        }
      }
    }

    // --- Command impls ---

    function handleHelp() {
      print("Available commands:", "jt-output-success");
      print("  help        Show this help");
      print("  clear       Clear the terminal");
      print("  about       Short intro about Joe");
      print("  whoami      Who Joe is in one command");
      print("  skills      Key skills & stack");
      print("  interests   Things Joe geeks out about");
      print("  projects    Selected projects (with links)");
      print("  jobboard    Info about the job board");
      print("  contact     How to get in touch");
      // ls, cd, sudo, rm, cat are intentionally not listed
    }

    function handleAbout() {
      print("About Joe", "jt-output-success");
      print([
        "Joe is a senior people/data scientist with a PhD in Economics and an MS in Computer Science.",
        "He works at the intersection of causal inference, people analytics, and machine learning,",
        "building models and tools that actually change how organizations make decisions."
      ].join("\n"));
    }

    function handleWhoAmI() {
      print("joe", "jt-output-success");
      print("Human. Data scientist. Causal inference nerd. Game dev tinkerer. Dad.");
    }

    function handleSkills() {
      print("Skills", "jt-output-success");
      print([
        "  • Analytics / Methods:",
        "      - Causal inference (DiD, synthetic control, RDD, matching, IV, causal ML)",
        "      - Experimental design & A/B testing",
        "      - Survival / attrition modeling, time series, forecasting",
        "",
        "  • Languages / Tools:",
        "      - Python (pandas, scikit-learn, statsmodels, PyMC, etc.)",
        "      - SQL (window functions, complex joins, CTE-heavy stuff)",
        "      - R (for stats / causal packages when needed)",
        "      - Spark, AWS (data pipelines & large-scale analytics)",
        "",
        "  • People Analytics:",
        "      - Quality of hire, recruiting funnel analytics, workforce planning",
        "      - Policy evaluation (return-to-office, time-off, workplace programs)",
        "",
        "  • Extra Nerdy:",
        "      - D3.js data viz",
        "      - Game dev (roguelikes, pixel art, systems design)"
      ].join("\n"));
    }

    function handleInterests() {
      print("Interests", "jt-output-success");
      print([
        "  • People analytics & how organizations really work",
        "  • Causal inference and doing more than 'just a model with features'",
        "  • Measuring algorithm usage and impact in the wild (GitHub, etc.)",
        "  • Building small but polished games (roguelikes, platformers, stealth)",
        "  • Pixel art & indie game aesthetics",
        "  • College football & sports data viz",
        "  • Photography, especially capturing family and local sports"
      ].join("\n"));
    }

    function handleProjects() {
      print("Projects", "jt-output-success");
      print(
        [
          "  • Algorithm Importance / GitHub Mining:",
          "      Mapping real-world code (e.g., GitHub repos) to algorithm families",
          "      to understand which algorithms actually matter in practice.",
          "",
          "  • People Analytics Job Board:",
          "      Scraped/curated roles across regions, levels, and companies,",
          "      with an eye toward fair access and transparency.",
          "",
          "  • Roguelike Game Experiments:",
          "      Prototyping systems-heavy games (ninja/stealth roguelike,",
          "      mafia deckbuilder, company founder sim, etc.).",
          "",
          "  • Data Viz / D3:",
          "      Interactive bump charts, hiring funnels, college football rankings,",
          "      and custom visualizations for storytelling.",
          "",
          "Links (replace with your real URLs):"
        ].join("\n"),
        "jt-output-info"
      );

      print(
        [
          '  - <a href="#" target="_blank">Algorithm importance project (placeholder)</a>',
          '  - <a href="#" target="_blank">People analytics job board (placeholder)</a>',
          '  - <a href="#" target="_blank">Game prototypes / demos (placeholder)</a>'
        ].join("\n"),
        "jt-output-info",
        true
      );
    }

    function handleJobBoard() {
      print("People Analytics Job Board", "jt-output-success");
      print(
        [
          "  A curated/scraped board focused on people analytics / HR data roles.",
          "  It surfaces roles by job level, region (US/UK/Canada/Australia),",
          "  and company, with plans for rich visualizations around opportunity,",
          "  mobility, and fairness in hiring.",
          "",
          "  Replace the link below with your actual job board URL:"
        ].join("\n")
      );

      print(
        '  → <a href="https://your-job-board-url.com" target="_blank">Visit the job board</a>',
        "jt-output-info",
        true
      );
    }

    function handleContact() {
      print("Contact", "jt-output-success");
      print(
        [
          "  Replace these placeholders with your real info:",
          ""
        ].join("\n")
      );
      print(
        [
          '  • Email: <a href="mailto:you@example.com">you@example.com</a>',
          '  • LinkedIn: <a href="https://www.linkedin.com/in/your-profile" target="_blank">your-profile</a>',
          '  • GitHub: <a href="https://github.com/your-github" target="_blank">your-github</a>'
        ].join("\n"),
        "jt-output-info",
        true
      );
    }

    // --- Hidden / bash-y commands ---

    function handleLs(args) {
      print(fakeFsRoot.join("    "));
    }

    function handleCd(args) {
      if (args.length === 0) {
        // cd with no args – pretend home
        print("", "jt-output-info");
        return;
      }

      const target = args[0];
      if (target === "top_secret" || target === "top_secret/") {
        print("bash: cd: top_secret: Permission denied", "jt-output-error");
      } else if (target === "projects" || target === "projects/") {
        print("bash: cd: projects: Not a real directory in this shell.", "jt-output-error");
        print("      Try running 'projects' instead.");
      } else if (target === "job-board" || target === "job-board/") {
        print("bash: cd: job-board: Not a real directory in this shell.", "jt-output-error");
        print("      Try running 'jobboard' instead.");
      } else {
        print(`bash: cd: ${target}: No such file or directory`, "jt-output-error");
      }
    }

    function handleSudo(args) {
      if (args.length === 0) {
        print("sudo: no command specified", "jt-output-error");
      } else {
        print("Nice try. This terminal doesn't grant root access.", "jt-output-error");
        print("Causal inference maybe, root privileges no.");
      }
    }

    function handleRmRf() {
      print("rm: unsafe operation blocked: rm -rf /", "jt-output-error");
      print("This universe persists whether you like it or not.");
    }

    function handleCat(args) {
      if (args.length === 0) {
        print("cat: missing file operand", "jt-output-error");
        return;
      }
      const file = args[0];
      if (file === "README.md") {
        print("# Joe's Terminal", "jt-output-success");
        print(
          [
            "",
            "This is a playful terminal-style interface to learn about Joe,",
            "his skills, interests, and projects.",
            "",
            "Try:",
            "  help      – list documented commands",
            "  skills    – see what Joe can do",
            "  projects  – explore a few things he's built",
            "",
            "And if you're curious, poke around with 'ls', 'cd', or even 'sudo'."
          ].join("\n")
        );
      } else {
        print(`cat: ${file}: No such file or directory`, "jt-output-error");
      }
    }

    // --- Keyboard handling ---
    function handleKeyDown(e) {
      if (document.activeElement !== term.node()) {
        term.node().focus();
      }

      if (e.key === "Backspace") {
        e.preventDefault();
        currentInput = currentInput.slice(0, -1);
        render();
        return;
      }

      if (e.key === "Enter") {
        e.preventDefault();
        const cmd = currentInput;
        currentInput = "";
        runCommand(cmd);
        render();
        return;
      }

      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
        currentInput += e.key;
        render();
      }
    }

    window.addEventListener("keydown", handleKeyDown);

    // --- Initial message ---
    print("Welcome to Joe's Terminal.", "jt-output-success");
    print("Type 'help' to see available commands.");
    render();
  </script>
</body>
